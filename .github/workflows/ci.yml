# CI: HMG-API's mod workflow (hook points, build, a package signed with a throwaway key: a test
# build) with the SDK hmgapi-sdk.json pins, and the native code segment for every libCarPlayCore
# build listed in source/tools/build.py (BUILDS), so a new car/firmware is one entry there.
# The segment needs no library from a car. The memory recipe is made from it locally
# (source/tools/build.py recipe, which reads the stock library) and committed; the "segment" job
# fails if a build has no recipe, or its recipe was made from other sources than these.
name: CI

on:
  push:
    branches: [main, "feature/**", "port/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    uses: Open-HMG/HMG-API/.github/workflows/mod.yml@b459567eed0a4c5645efe2deb349b46a3523a422
    with:
      mods: source/mod

  plan:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.list.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "builds=$(python3 source/tools/build.py list)" >> "$GITHUB_OUTPUT"

  segment:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clang lld
          pip install pyelftools==0.32
      - name: Segment for libCarPlayCore ${{ matrix.build }}
        run: python3 source/tools/build.py seg "${{ matrix.build }}" "out/seg-${{ matrix.build }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cp-climate-segment-${{ matrix.build }}
          path: |
            out/seg-${{ matrix.build }}/segment.bin
            out/seg-${{ matrix.build }}/segment.json
          retention-days: 30
      - name: The committed recipe matches this segment and mod.json lists it
        run: python3 source/tools/build.py verify "${{ matrix.build }}" "out/seg-${{ matrix.build }}"
